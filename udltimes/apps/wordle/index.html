<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pruebecita de Wordle</title>

    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { rubik: ['Rubik', 'sans-serif'] },
          colors: { udl: '#700040' }
          key: {
                correct: '#700040', // Morado
                present: '#C9B458', // Amarillo
                absent: '#787C7E',  // Gris
                default: '#D3D6DA', // Gris claro
                hover: '#BFC3C7',
            }
        }
      }
    }
    </script>
</head>
<body class="bg-sky-50 text-black flex items-start justify-center h-screen pt-[110px]">

    <div class="text-center">
        <h1 class="text-3xl dark:text-pink-900 font-rubik mb-5 font-extrabold">WORDLE</h1>

        <div id="tablero" class="grid grid-cols-5 grid-rows-6 gap-1.5 mx-auto w-fit"></div>
        <div id="keyboard" class="flex flex-col items-center gap-2 mt-7"></div>
    </div>

    <script>
        // Tablero
        const tablero = document.getElementById("tablero");
        for (let fila = 0; fila < 6; fila++) {
            for (let col = 0; col < 5; col++) {
                const casilla = document.createElement("div");
                casilla.id = `box-${fila}${col}`;
                casilla.className = "w-12 h-12 border-2 border-gray-400 flex items-center justify-center text-xl font-bold uppercase";
                tablero.appendChild(casilla);
            }
        }

        const filasTeclado = [
            ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
            ["A", "S", "D", "F", "G", "H", "J", "K", "L", "Ñ"],
            ["ENTER", "Z", "X", "C", "V", "B", "N", "M", "DEL"]
       ];

        const keyboard = document.getElementById("keyboard");

        filasTeclado.forEach(fila => {
            const filaDiv = document.createElement("div");
            filaDiv.className = "flex gap-1.5 w-full justify-center";

            fila.forEach(letra => {
                const tecla = document.createElement("div");
                tecla.id = `key-${letra}`;

                let clases = "h-14 border-2  flex items-center justify-center text-sm font-bold rounded bg-gray-300 cursor-pointer hover:bg-gray-400 transition-colors uppercase ";

                if (letra === "ENTER" || letra === "DEL") {
                    clases += "px-4 min-w-[65px]";
                } else {
                    clases += "w-10";
                }

                tecla.className = clases;
                tecla.innerText = letra === "DEL" ? "⌫" : letra;

                tecla.onclick = () => manejarEntrada(letra);

                filaDiv.appendChild(tecla);
            });
            keyboard.appendChild(filaDiv);
        });
    </script>
</body>
</html>
