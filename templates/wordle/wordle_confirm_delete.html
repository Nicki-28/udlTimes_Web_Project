{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-12 p-6 bg-red-50 rounded-lg shadow-md border border-red-100 text-center">
    <h2 class="text-2xl font-bold text-red-800 mb-4">Are you sure?</h2>
    
    <p class="text-gray-700 mb-6">
        You are about to delete your Wordle with the secret word <strong class="uppercase">{{ object.word }}</strong>.<br>
        This action cannot be undone. 
    </p>

    <form method="post" class="flex justify-center gap-4">
        {% csrf_token %}
        
        <a href="javascript:history.back()" 
           class="px-6 py-2 border border-gray-300 text-gray-600 font-semibold rounded-full hover:bg-gray-100 transition-colors duration-300">
            Cancel
        </a>

        <button type="submit" 
            class="px-6 py-2 bg-[#700040] text-white font-bold rounded-full hover:bg-red-800 transition-colors duration-300">
            Yes, delete Wordle
        </button>
    </form>
</div>
{% endblock %}
