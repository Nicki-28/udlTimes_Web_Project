{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-12 p-6 bg-white rounded-lg shadow-md border border-gray-100">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">
        {% if object %}Edit Wordle{% else %}New Wordle{% endif %}
    </h2>

    <form method="post" class="flex flex-col gap-4">
        {% csrf_token %}
        
        <div class="flex flex-col gap-3 text-gray-700">
            {{ form.as_p }}
        </div>

        <div class="flex justify-center mt-6">
            <button type="submit" 
                class="flex items-center justify-center gap-2 px-6 py-2 border-2 border-[#700040] text-[#700040] font-bold rounded-full uppercase tracking-wider text-sm hover:bg-[#700040] hover:text-white transition-colors duration-300">
                {% if object %}Save Changes{% else %}Create your own Wordle{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
