{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-12 p-6 bg-white rounded-lg shadow-md border border-gray-100">
  <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">
    {% if object %}Edit Wordle{% else %}New Wordle{% endif %}
  </h2>

  <form method="post" class="flex flex-col gap-4" id="wordle-form">
    {% csrf_token %}

    <div class="flex flex-col gap-3 text-gray-700">
      {{ form.as_p }}
    </div>

    {% if form.errors %}
      {% for field in form %}
        {% for error in field.errors %}
          <p class="text-red-600 text-sm font-semibold text-center">⚠ {{ error }}</p>
        {% endfor %}
      {% endfor %}
    {% endif %}

    <p id="word-error" class="text-red-600 text-sm font-semibold text-center hidden"></p>

    <div class="flex justify-center mt-6">
      <button type="submit"
        class="flex items-center justify-center gap-2 px-6 py-2 border-2 border-[#700040] text-[#700040] font-bold rounded-full uppercase tracking-wider text-sm hover:bg-[#700040] hover:text-white transition-colors duration-300">
        {% if object %}Save Changes{% else %}Create your own Wordle{% endif %}
      </button>
    </div>
  </form>
</div>

<script>
  const form = document.getElementById('wordle-form');
  const errorEl = document.getElementById('word-error');
  const wordInput = form.querySelector('input[name="word"]');
  const spanishLetters = /^[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]+$/;

  function validate() {
    const val = wordInput.value.trim();
    if (val.length !== 5) {
      errorEl.textContent = 'The word must be exactly 5 letters long';
      errorEl.classList.remove('hidden');
      return false;
    }
    if (!spanishLetters.test(val)) {
      errorEl.textContent = 'Only letters are allowed';
      return false;
    }
    errorEl.classList.add('hidden');
    return true;
  }

  wordInput.addEventListener('input', validate);
  form.addEventListener('submit', e => { if (!validate()) e.preventDefault(); });
</script>
{% endblock %}
