<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UdL-Times | Wordle</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#700040", // University Purple
                        "primary-light": "#8a1a58",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        secondary: "#f59e0b", // Gold
                        correct: "#700040", // Signature UdL Purple (replacing green)
                        present: "#f59e0b", // Gold (replacing yellow)
                        absent: "#475569", // Slate 600
                    },
                    fontFamily: {
                        display: ["Bungee", "cursive"],
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem",
                    },
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        .grid-pattern {
            background-image: radial-gradient(circle, #00000010 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .dark .grid-pattern {
            background-image: radial-gradient(circle, #ffffff10 1px, transparent 1px);
        }
        .wordle-grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
        }
        .wordle-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .tile {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 2px solid #cbd5e1;
            user-select: none;
        }
        .dark .tile {
            border-color: #334155;
        }
        .tile-correct {
            background-color: theme('colors.correct');
            border-color: theme('colors.correct');
            color: white;
        }
        .tile-present {
            background-color: theme('colors.present');
            border-color: theme('colors.present');
            color: white;
        }
        .tile-absent {
            background-color: theme('colors.absent');
            border-color: theme('colors.absent');
            color: white;
        }
        .key {
            background-color: #e2e8f0;
            border-radius: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            height: 58px;
            user-select: none;
            transition: all 0.1s;
        }
        .dark .key {
            background-color: #334155;
        }
        .key-wide {
            flex: 1.5;
        }
        .key-correct {
            background-color: theme('colors.correct') !important;
            color: white;
        }
        .key:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-sans grid-pattern">
