<div class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md"
     id="register-modal">
    <div class="relative bg-white dark:bg-slate-800 w-full max-w-md p-8 rounded-2xl border border-primary shadow-2xl">
        <button class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"
                onclick="document.getElementById('register-modal').classList.add('hidden')">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="text-center mb-8">
            <h2 class="font-display text-4xl text-primary mb-2 italic tracking-tight uppercase">JOIN THE CLUB</h2>
            <p class="text-slate-500 dark:text-slate-400">Create your university gamer profile</p>
        </div>

        <form class="space-y-4" method="post" action="/accounts/register/">
            {% csrf_token %}
            <div class="relative">
                <input class="w-full px-4 py-3 border border-black dark:border-slate-100 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary dark:bg-slate-800 outline-none"
                       placeholder="full name" type="text" name="full_name"/>
            </div>
            <div class="relative">
                <input class="w-full px-4 py-3 border border-black dark:border-slate-100 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary dark:bg-slate-800 outline-none"
                       placeholder="university email" type="email" name="email"/>
            </div>
            <div class="relative">
                <input class="w-full px-4 py-3 border border-black dark:border-slate-100 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary dark:bg-slate-800 outline-none"
                       placeholder="username" type="text" name="username"/>
            </div>
            <div class="relative">
                <input class="w-full px-4 py-3 border border-black dark:border-slate-100 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary dark:bg-slate-800 outline-none"
                       placeholder="password" type="password" name="password"/>
            </div>

            {% if register_error %}
            <p class="text-red-500 text-sm text-center">{{ register_error }}</p>
            {% endif %}


            <button class="w-full py-3 bg-primary text-white font-display text-lg rounded-md hover:bg-opacity-90 transition-colors shadow-md uppercase tracking-wider"
                    type="submit">
                REGISTER
            </button>

        </form>
        <p class="text-center mt-8 text-sm text-slate-600 dark:text-slate-400">
            Already have an account?
            <a class="text-primary font-bold hover:underline cursor-pointer"
               onclick="document.getElementById('register-modal').classList.add('hidden'); document.getElementById('login-modal').classList.remove('hidden')">
                Log In
            </a>
        </p>
    </div>
</div>
