<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,700;0,800;1,800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "primary": "#700740",
                "background-light": "#f7f6f8",
                "background-dark": "#1c1022",
            },
            fontFamily: {
                "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
        },
    },
}
</script>

</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[480px] bg-white dark:bg-slate-900 rounded-xl shadow-2xl overflow-hidden border border-primary/10">

<!-- Header Image -->
<div class="relative h-48 w-full bg-primary/10 overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center"
style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBbgAcRdqtRDzuNmq7rGypaKqEutcr2Ya6cj95ASGl4PXNK_LEEUjSEqhHTnT8Yw-3s2zvzxygZRsTA9JO2vnDkMBuPUN2GEnb8jYlT-WgINmDZ90wrS-RIdcP3-14Gi6AByfA-ubQmvRKbpO-nYgCOB-TrT0Mpy1t5CYBi_qMB-DlZBvURhyWPdjWmmLdNgWD3zWukbi1QaAaI6y_MuEkfDD_Liw6yRx_oM6G3WzvygxzKUbDm_ILEoIZBz50yiVbrUS07Iazv-fw");'>
</div>
<div class="absolute inset-0 bg-gradient-to-t from-white dark:from-slate-900 to-transparent"></div>
</div>

<div class="px-8 pb-10 -mt-12 relative z-10">

<!-- Title -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-20 h-20 bg-white dark:bg-slate-800 rounded-full shadow-lg mb-4 border-4 border-background-light dark:border-background-dark">
<span class="material-symbols-outlined text-primary text-4xl">school</span>
</div>

<h1 class="text-4xl font-black italic tracking-tighter text-primary uppercase">A JUGAR!</h1>
<p class="text-slate-500 dark:text-slate-400 font-medium">UdL-Times Register</p>
</div>

<!-- DJANGO FORM -->
<form method="post" class="space-y-5">
{% csrf_token %}

{% for field in form %}
<div>

<label for="{{ field.id_for_label }}"
class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5 ml-1">
{{ field.label }}
</label>

<div class="relative">
{{ field }}
</div>

{% if field.help_text %}
<small class="text-slate-400 text-xs ml-1">{{ field.help_text }}</small>
{% endif %}

{% for error in field.errors %}
<small class="text-red-500 text-xs ml-1 block">{{ error }}</small>
{% endfor %}

</div>
{% endfor %}

<button type="submit"
class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/30 transition-all active:scale-[0.98]">
SIGN UP
</button>

</form>

<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-white dark:bg-slate-900 text-slate-500">
Or continue with
</span>
</div>
</div>

<!-- Google login -->
<button class="w-full flex items-center justify-center gap-3 px-4 py-3.5 border-2 border-slate-100 dark:border-slate-800 rounded-lg hover:bg-background-light dark:hover:bg-slate-800 transition-colors">

<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
</svg>

<span class="font-semibold text-slate-700 dark:text-slate-300">
Sign in with Google
</span>

</button>

<!-- Footer -->
<p class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
Already have an account?
<a class="text-primary font-bold hover:underline" href="/login">
Log in
</a>
</p>

</div>
</div>

</body>
</html>
