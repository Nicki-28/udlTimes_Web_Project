<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#700740",
        "background-light": "#f7f6f8",
        "background-dark": "#1c1022",
      },
      fontFamily: {
        "display": ["Plus Jakarta Sans", "sans-serif"]
      },
      borderRadius: {
        "DEFAULT": "0.25rem",
        "lg": "0.5rem",
        "xl": "0.75rem",
        "full": "9999px"
      },
    },
  },
}
</script>

<title>Login - UdL-Times</title>
</head>

<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-4">

<div class="max-w-[520px] w-full bg-white dark:bg-slate-900 rounded-xl shadow-2xl overflow-hidden border border-primary/10">

<!-- Header -->
<div class="relative h-40 w-full bg-primary/10">
<div class="absolute inset-0 bg-cover bg-center"
style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBk1cIXrGtKsVSdid48nvtCspVkFogbe8xG38BiCssPGZyYEuuVVFKznx1tStWGY6IrOkH5Gqfep1pDyUsj0nIMs2vI4rdQ1OM-gOrg5nt-pWlfVZ6dzL0J9xh9PNNq9_hVHG0wmuwE0iPxprcfpEXVoS34UK8UVKyD2WUbrA024uDfZQ5Z40B_7QgDkcjvYjMVxFfGjsYILCV6hSUNCkN_hz1z-KFC4pb86N1JyNjWzI4DeZ5AbckhPbOf0SA1LW8vKPdL4Cl-WTs')"></div>

<div class="absolute inset-0 bg-gradient-to-t from-white dark:from-slate-900 to-transparent"></div>

<div class="absolute bottom-4 left-8">
<div class="w-16 h-16 bg-white rounded-lg shadow-md flex items-center justify-center p-2 border border-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">school</span>
</div>
</div>
</div>

<div class="px-8 pt-2 pb-10">

<!-- Title -->
<div class="mb-8">
<h1 class="text-slate-900 dark:text-slate-100 text-4xl font-black italic tracking-tight leading-none mb-2">
INICIAR SESIÓN
</h1>
<p class="text-primary/70 dark:text-primary/50 text-sm font-medium">
Access your UdL-Times account.
</p>
</div>

<!-- DJANGO LOGIN FORM -->
<form method="post" class="space-y-4">
{% csrf_token %}

<div class="space-y-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">
Username
</label>

<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">
person
</span>

{{ form.username }}

</div>
</div>

<div class="space-y-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">
Password
</label>

<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">
lock
</span>

{{ form.password }}

</div>
</div>

<button type="submit"
class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-6">

LOGIN
<span class="material-symbols-outlined">arrow_forward</span>

</button>

</form>

<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
</div>

<div class="relative flex justify-center text-sm">
<span class="px-4 bg-white dark:bg-slate-900 text-slate-500 font-medium">
Or login with
</span>
</div>
</div>

<!-- Google login -->
<button class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold py-3 rounded-lg transition-all mb-8">

<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
</svg>

Google

</button>

<!-- Footer -->
<div class="text-center">
<p class="text-slate-600 dark:text-slate-400 text-sm">
Don't have an account?
<a class="text-primary font-bold hover:underline ml-1" href="/accounts/signup/">
Register
</a>
</p>
</div>

</div>
</div>

</body>
</html>
