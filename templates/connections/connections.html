<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>UdL-Times | Connections</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#700040",
            "primary-light": "#8a1a5a",
            "primary-dark": "#5a0033",
            "background-light": "#f8fafc",
            "background-dark": "#0f172a",
            secondary: "#f59e0b",
          },
          fontFamily: {
            display: ["Bungee", "cursive"],
            sans: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.75rem",
          },
        },
      },
    };
  </script>
  
  <style type="text/tailwindcss">
    .grid-pattern {
      background-image: radial-gradient(circle, #00000010 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .connection-card {
      transition: all 0.2s ease;
    }
    .connection-card.selected {
      @apply bg-primary text-white border-primary shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)];
    }
  </style>
</head>

<body class="bg-background-light text-slate-900 min-h-screen font-sans grid-pattern">

  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a class="flex items-center gap-4 hover:opacity-80 transition-opacity" href="#">
          <div class="flex flex-col items-center">
            <span class="material-symbols-outlined text-primary text-3xl">school</span>
            <span class="text-[8px] font-bold leading-none">UdL</span>
          </div>
          <h1 class="font-display text-2xl tracking-tighter text-primary uppercase">UDL-TIMES</h1>
        </a>
      </div>
      <div class="flex items-center gap-6">
        <div class="hidden md:flex flex-col items-end">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-widest leading-none mb-1">Connections</span>
          <span class="font-display text-sm">PUZZLE #42</span>
        </div>
        <button class="px-6 py-2 border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold transition-all duration-200 rounded-full">
          LOG IN
        </button>
      </div>
    </div>
  </header>
  
  <main class="max-w-2xl mx-auto px-4 py-12">
    
    <div class="text-center mb-8">
      <h2 class="text-lg font-medium mb-2">Create four groups of four!</h2>
    </div>

    <div id="categorias-resueltas" class="space-y-2 mb-2"></div>
    <div id="grid" class="grid grid-cols-4 gap-2 mb-10"></div>
    
    <div class="flex flex-col items-center gap-8">
      <div class="flex items-center gap-3">
        <span class="text-sm font-bold text-slate-500 uppercase">Mistakes remaining:</span>
        <div id="vidas-container" class="flex gap-2"></div>
      </div>

      <div class="flex flex-wrap justify-center gap-4">
        <button onclick="mezclarPalabras()" class="px-8 py-3 rounded-full border-2 border-slate-900 font-bold hover:bg-slate-100 transition-colors">SHUFFLE</button>
        <button onclick="deselectAll()" class="px-8 py-3 rounded-full border-2 border-slate-900 font-bold hover:bg-slate-100 transition-colors">DESELECT ALL</button>
        <button onclick="comprobarJugada()" class="px-10 py-3 rounded-full bg-primary text-white font-bold hover:bg-primary-dark transition-colors shadow-lg shadow-primary/20">SUBMIT</button>
      </div>
    </div>
    
    <div class="mt-16 text-center">
      <a class="inline-flex items-center gap-2 text-slate-500 hover:text-primary transition-colors font-bold text-sm" href="#">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        BACK TO GAMES HUB
      </a>
    </div>
  </main>
  
  <script>
    // simulamos lo que nos devolvera django
    let palabrasDelDia = [
      "RECTORAT", "CAPPONT", "ETSEA", "SALUT",
      "DRET", "MEDICINA", "INFORMATICA", "FILOLOGIA",
      "EXAM", "QUIZ", "TEST", "FINALS",
      "CAFE", "SEU", "PARTY", "PLACA"
    ];

    // desordenamos la lista (shuffle inicial)
    palabrasDelDia.sort(() => Math.random() - 0.5);

    // guardamos las palabras que el usuario ha clickado
    let palabrasSeleccionadas = [];

    // dibujar la cuadricula
    function dibujarCuadricula() {
      const contenedorGrid = document.getElementById("grid");
      contenedorGrid.innerHTML = ""; // limpiamos antes de pintar

      // recorremos las 16 palabras una a una
      palabrasDelDia.forEach(palabra => {
        // el usuario ha hecho click en esta palabra?
        const estaSeleccionada = palabrasSeleccionadas.includes(palabra);

        // empezamos a montar las clases css
        let clasesBase = "connection-card h-24 flex items-center justify-center rounded-lg border-2 font-bold text-sm text-center p-2 uppercase ";

        // si esta seleccionada, le ponemos la clase 'selected' de <style>
        // si no, le ponemos los colores grises
        if (estaSeleccionada) {
          clasesBase += "selected cursor-pointer";
        } else {
          clasesBase += "bg-slate-200 border-transparent hover:bg-slate-300 text-slate-900 cursor-pointer";
        }

        // creamos el boton en HTML y le decimos que al clickar llame a la funcion
        const botonHTML = `<button onclick="togglePalabra('${palabra}')" class="${clasesBase}">${palabra}</button>`;

        // lo metemos en el contenedor
        contenedorGrid.innerHTML += botonHTML;
      });
    }

    // interactividad
    function togglePalabra(palabra) {
      if (palabrasSeleccionadas.includes(palabra)) {
        // si ya estaba seleccionada, la quitamos
        palabrasSeleccionadas = palabrasSeleccionadas.filter(p => p !== palabra);
      } else {
        // si no estaba, y tenemos menos de 4, la añadimos
        if (palabrasSeleccionadas.length < 4) {
          palabrasSeleccionadas.push(palabra);
        }
      }

      // despues de cambiar el estado, repintamos la cuadricula
      dibujarCuadricula();
    }

    function deselectAll() {
      palabrasSeleccionadas = [];
      dibujarCuadricula();
    }

    dibujarCuadricula();
  </script>
</body>
</html>
