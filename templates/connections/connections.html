<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>UdL-Times | Connections</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>

    <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#700040",
            "primary-light": "#8a1a5a",
            "primary-dark": "#5a0033",
            "background-light": "#f8fafc",
            "background-dark": "#0f172a",
            secondary: "#f59e0b",
          },
          fontFamily: {
            display: ["Bungee", "cursive"],
            sans: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.75rem",
          },
        },
      },
    };
  </script>

  <style>
    .grid-pattern {
      background-image: radial-gradient(circle, #00000010 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .connection-card {
      height: 80px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: #e2e8f0;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', sans-serif;
    }
    .connection-card:hover:not(.selected) { background: #cbd5e1; }
    .connection-card:active { transform: scale(0.96); }

    .connection-card.selected {
      background: #1e293b;
      color: #fff;
      box-shadow: 0 4px 12px rgba(30,41,59,0.2);
      animation: popSelect 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .solved-row {
      animation: flipIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .life-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #700040;
      transition: background 0.3s, transform 0.3s;
    }
    .life-dot.lost {
      background: #e2e8f0;
      transform: scale(0.8);
    }

    #toast {
      position: fixed;
      top: 88px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: #1e293b;
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #one-away-slot {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .one-away-badge {
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      padding: 6px 18px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      animation: fadeInDown 0.3s ease both;
    }

    @keyframes popSelect {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.07); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%     { transform: translateX(-8px); }
      30%     { transform: translateX(8px); }
      45%     { transform: translateX(-6px); }
      60%     { transform: translateX(6px); }
      75%     { transform: translateX(-3px); }
      90%     { transform: translateX(3px); }
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.1); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    @keyframes flipIn {
      0%   { transform: rotateX(-90deg); opacity: 0; }
      100% { transform: rotateX(0deg);  opacity: 1; }
    }
    @keyframes fadeInDown {
      0%   { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .shake          { animation: shake 0.45s ease both !important; }
    @keyframes flipOut {
      0%   { transform: rotateY(0deg) scale(1); }
      100% { transform: rotateY(-90deg) scale(1.05); }
    }
    @keyframes flipReveal {
      0%   { transform: rotateY(90deg) scale(1.05); }
      100% { transform: rotateY(0deg) scale(1); }
    }
    .flip-out    { animation: flipOut    0.3s ease forwards; }
    .flip-reveal { animation: flipReveal 0.3s ease forwards; }
  </style>
</head>

<body class="bg-background-light text-slate-900 min-h-screen font-sans grid-pattern">

  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a class="flex items-center gap-4 hover:opacity-80 transition-opacity" href="/">
          <div class="flex flex-col items-center">
            <span class="material-symbols-outlined text-primary text-3xl">school</span>
            <span class="text-[8px] font-bold leading-none">UdL</span>
          </div>
          <h1 class="font-display text-2xl tracking-tighter text-primary uppercase">UDL-TIMES</h1>
        </a>
      </div>
      <div class="flex items-center gap-6">
        <div class="hidden md:flex flex-col items-end">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-widest leading-none mb-1">Connections</span>
          <span class="font-display text-sm">PUZZLE #1</span>
        </div>
        <a href="/login/" class="px-6 py-2 border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold transition-all duration-200 rounded-full text-center inline-block">
          LOG IN
        </a>
      </div>
    </div>
  </header>

  <div id="toast"></div>

  <main class="max-w-2xl mx-auto px-4 py-10">

    <div class="text-center mb-6">
      <h2 class="text-base font-medium text-slate-500">Create four groups of four!</h2>
    </div>

    <div id="categorias-resueltas" class="space-y-2 mb-2"></div>
    <div id="grid" class="grid grid-cols-4 gap-2 mb-3"></div>
    <div id="one-away-slot"></div>

    <div class="flex flex-col items-center gap-6 mt-4">
      <div class="flex items-center gap-3">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Mistakes remaining:</span>
        <div id="vidas-container" class="flex gap-2"></div>
      </div>
      <div class="flex flex-wrap justify-center gap-3">
        <button onclick="mezclarPalabras()" class="px-8 py-3 rounded-full border-2 border-slate-900 font-bold text-sm hover:bg-slate-100 transition-colors">SHUFFLE</button>
        <button onclick="deselectAll()" class="px-8 py-3 rounded-full border-2 border-slate-900 font-bold text-sm hover:bg-slate-100 transition-colors">DESELECT ALL</button>
        <button onclick="comprobarJugada()" class="px-10 py-3 rounded-full bg-primary text-white font-bold text-sm hover:bg-primary-dark transition-colors shadow-lg shadow-primary/20">SUBMIT</button>
      </div>
    </div>

    <div class="mt-14 text-center">
      <a class="inline-flex items-center gap-2 text-slate-500 hover:text-primary transition-colors font-bold text-sm" href="/">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        BACK TO GAMES HUB
      </a>
    </div>
  </main>

  <script>
    // soluciones secretas (mas adelante django lo pillara de la BBDD)
    const soluciones = [
      { titulo: "CAMPUS BUILDINGS", palabras: ["RECTORAT","CAPPONT","ETSEA","SALUT"], color: "#e9c46a" },
      { titulo: "UdL DEGREES", palabras: ["DRET","MEDICINA","INFORMATICA","FILOLOGIA"], color: "#f4a261" },
      { titulo: "EXAM SYNONYMS", palabras: ["EXAM","QUIZ","TEST","FINALS"], color: "#e76f51" },
      { titulo: "HANG OUT SPOTS", palabras: ["CAFE","SEU","PARTY","PLACA"], color: "#c1440e" }
    ];

    // estado del juego
    let categoriasAcertadas = [];
    let palabrasSeleccionadas = [];
    let vidas = 4;
    let enviando = false;

    // .flatMap() coge todas las palabras de los 4 grupos y los mete en una sola lista de 16
    let palabrasActivas = soluciones.flatMap(s => s.palabras).sort(() => Math.random() - 0.5);


    // RENDER COMPLETO: se llama al iniciar, al hacer shuffle y tras un submit correcto

    // añade una categoria resuelta a las ya resueltas con animacion
    const COLORES_CLAROS = ["#e9c46a", "#f4a261", "#e76f51", "#c1440e"];

    function textoParaFondo(color) {
      return "#5a0033";
    }

    function anadirCategoriaResuelta(cat) {
      const divResueltas = document.getElementById("categorias-resueltas");
      const div = document.createElement("div");
      const textColor = textoParaFondo(cat.color);
      div.className = "rounded-xl p-4 text-center flex flex-col items-center justify-center";
      div.style.background = cat.color;
      div.style.color = textColor;
      div.innerHTML = `
        <h3 class="font-display text-xs tracking-widest mb-1">${cat.titulo}</h3>
        <p class="text-xs uppercase font-bold opacity-90">${cat.palabras.join(", ")}</p>`;
      div.style.transform = "scaleY(0)";
      div.style.transformOrigin = "top";
      div.style.opacity = "0";
      div.style.transition = "transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease";
      divResueltas.appendChild(div);
      void div.offsetWidth;
      div.style.transform = "scaleY(1)";
      div.style.opacity = "1";
    }

    function dibujarJuego() {
      // pintar la cuadricula (abajo)
      const divGrid = document.getElementById("grid");
      divGrid.innerHTML = "";
      palabrasActivas.forEach(palabra => {
        const btn = document.createElement("button");
        btn.className = "connection-card" + (palabrasSeleccionadas.includes(palabra) ? " selected" : "");
        btn.textContent = palabra;
        btn.dataset.palabra = palabra;
        btn.addEventListener("click", onCardClick);
        divGrid.appendChild(btn);
      });

      // Vidas
      actualizarVidas();
    }

    // actualizar seleccion
    function actualizarSeleccion() {
      document.querySelectorAll(".connection-card").forEach(btn => {
        btn.classList.toggle("selected", palabrasSeleccionadas.includes(btn.dataset.palabra));
      });
    }

    function actualizarVidas() {
      const divVidas = document.getElementById("vidas-container");
      divVidas.innerHTML = "";
      for (let i = 0; i < 4; i++) {
        const dot = document.createElement("div");
        dot.className = "life-dot" + (i >= vidas ? " lost" : "");
        divVidas.appendChild(dot);
      }
    }

    // INTERACTIVIDAD

    // currentTarget siempre es el botón, aunque el click venga del texto hijo
    function onCardClick(e) {
      togglePalabra(e.currentTarget.dataset.palabra);
    }

    function togglePalabra(palabra) {
      if (enviando) return;
      if (palabrasSeleccionadas.includes(palabra)) {
        // si ya estaba seleccionada, la quitamos
        palabrasSeleccionadas = palabrasSeleccionadas.filter(p => p !== palabra);
      } else {
        // si no estaba, y tenemos menos de 4, la añadimos
        if (palabrasSeleccionadas.length >= 4) return;
        palabrasSeleccionadas.push(palabra);
      }
        actualizarSeleccion();
    }

    function deselectAll() {
      if (enviando) return;
      palabrasSeleccionadas = [];
      actualizarSeleccion();
    }

    function mezclarPalabras() {
      if (enviando) return;
      palabrasActivas.sort(() => Math.random() - 0.5);
      // setTimeout 0 para que el rebuild ocurra en el siguiente tick,
      // después de que el evento click del shuffle haya terminado del todo
      setTimeout(dibujarJuego, 0);
    }


    // SUBMIT con animaciones
    function comprobarJugada() {
      if (palabrasSeleccionadas.length !== 4) return; // tiene que haber 4 marcadas

      // buscamos si la seleccion coincide exactamente con alguna solucion
      const categoriaEncontrada = soluciones.find(solucion => {
        return solucion.palabras.every(p => palabrasSeleccionadas.includes(p));
      });

      if (categoriaEncontrada) {
        categoriasAcertadas.push(categoriaEncontrada); // la pasamos arriba
        palabrasActivas = palabrasActivas.filter(p => !palabrasSeleccionadas.includes(p)); // la borramos de abajo
        palabrasSeleccionadas = []; // vaciamos la seleccion

        // comprobar si hemos ganado
        if (categoriasAcertadas.length == 4) {
          setTimeout(() => alert("CONGRATULATIONS! You won."), 300);
        }
      } else {
        vidas--;
        if (vidas <= 0) {
          setTimeout(() => alert("GAME OVER! You've run out of lives."), 300);
        }
      }

      dibujarJuego();
    }

    dibujarJuego();
  </script>
</body>
</html>
