<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>UdL-Times | Connections</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#700040",
            "primary-light": "#8a1a5a",
            "primary-dark": "#5a0033",
            "background-light": "#f8fafc",
            "background-dark": "#0f172a",
            secondary: "#f59e0b",
          },
          fontFamily: {
            display: ["Bungee", "cursive"],
            sans: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.75rem",
          },
        },
      },
    };
  </script>
  
  <style type="text/tailwindcss">
    .grid-pattern {
      background-image: radial-gradient(circle, #00000010 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .connection-card {
      transition: all 0.2s ease;
    }
    .connection-card.selected {
      @apply bg-primary text-white border-primary shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)];
    }
  </style>
</head>

<body class="bg-background-light text-slate-900 min-h-screen font-sans grid-pattern">

  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a class="flex items-center gap-4 hover:opacity-80 transition-opacity" href="/">
          <div class="flex flex-col items-center">
            <span class="material-symbols-outlined text-primary text-3xl">school</span>
            <span class="text-[8px] font-bold leading-none">UdL</span>
          </div>
          <h1 class="font-display text-2xl tracking-tighter text-primary uppercase">UDL-TIMES</h1>
        </a>
      </div>
      <div class="flex items-center gap-6">
        <div class="hidden md:flex flex-col items-end">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-widest leading-none mb-1">Connections</span>
          <span class="font-display text-sm">PUZZLE #1</span>
        </div>
        <a href="/login/" class="px-6 py-2 border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold transition-all duration-200 rounded-full text-center inline-block">
          LOG IN
        </a>
      </div>
    </div>
  </header>
  
  <main class="max-w-2xl mx-auto px-4 py-12">
    
    <div class="text-center mb-8">
      <h2 class="text-lg font-medium mb-2">Create four groups of four!</h2>
    </div>

    <div id="categorias-resueltas" class="space-y-2 mb-2"></div>
    <div id="grid" class="grid grid-cols-4 gap-2 mb-10"></div>
    
    <div class="flex flex-col items-center gap-8">
      <div class="flex items-center gap-3">
        <span class="text-sm font-bold text-slate-500 uppercase">Mistakes remaining:</span>
        <div id="vidas-container" class="flex gap-2"></div>
      </div>

      <div class="flex flex-wrap justify-center gap-4">
        <button onclick="mezclarPalabras()" class="px-8 py-3 rounded-full border-2 border-slate-900 font-bold hover:bg-slate-100 transition-colors">SHUFFLE</button>
        <button onclick="deselectAll()" class="px-8 py-3 rounded-full border-2 border-slate-900 font-bold hover:bg-slate-100 transition-colors">DESELECT ALL</button>
        <button onclick="comprobarJugada()" class="px-10 py-3 rounded-full bg-primary text-white font-bold hover:bg-primary-dark transition-colors shadow-lg shadow-primary/20">SUBMIT</button>
      </div>
    </div>
    
    <div class="mt-16 text-center">
      <a class="inline-flex items-center gap-2 text-slate-500 hover:text-primary transition-colors font-bold text-sm" href="/">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        BACK TO GAMES HUB
      </a>
    </div>
  </main>
  
  <script>
    // soluciones secretas (mas adelante django lo pillara de la BBDD)
    const soluciones = [
      { titulo: "CAMPUS BUILDINGS", palabras: ["RECTORAT", "CAPPONT", "ETSEA", "SALUT"], color: "bg-primary" },
      { titulo: "UdL DEGREES", palabras: ["DRET", "MEDICINA", "INFORMATICA", "FILOLOGIA"], color: "bg-primary-light" },
      { titulo: "EXAM SYNONYMS", palabras: ["EXAM", "QUIZ", "TEST", "FINALS"], color: "bg-primary-dark" },
      { titulo: "HANG OUT SPOTS", palabras: ["CAFE", "SEU", "PARTY", "PLACA"], color: "bg-slate-800" }
    ];

    // estado del juego
    let categoriasAcertadas = [];
    let palabrasSeleccionadas = [];
    let vidas = 4;

    // .flatMap() coge todas las palabras de los 4 grupos y los mete en una sola lista de 16
    let palabrasActivas = soluciones.flatMap(s => s.palabras).sort(() => Math.random() - 0.5);

    function dibujarJuego() {
      // pintar las categorias acertadas (arriba)
      const divResueltas = document.getElementById("categorias-resueltas");
      divResueltas.innerHTML = "";
      categoriasAcertadas.forEach(cat => {
        divResueltas.innerHTML += `
        <div class="${cat.color} text-white p-4 rounded-lg text-center flex flex-col items-center justify-center shadow-md animate-fade-in">
            <h3 class="font-display text-sm tracking-widest mb-1">${cat.titulo}</h3>
            <p class="text-xs uppercase font-bold opacity-90">${cat.palabras.join(", ")}</p>
          </div>
        `;
      });

      // pintar la cuadricula (abajo)
      const divGrid = document.getElementById("grid");
      divGrid.innerHTML = "";
      palabrasActivas.forEach(palabra => {
        const estaSeleccionada = palabrasSeleccionadas.includes(palabra);
        let clasesBase = "connection-card h-24 flex items-center justify-center rounded-lg border-2 font-bold text-sm text-center p-2 uppercase cursor-pointer ";

        if (estaSeleccionada) {
          clasesBase += "selected";
        } else {
          clasesBase += "bg-slate-200 border-transparent hover:bg-slate-300 text-slate-900";
        }

        divGrid.innerHTML += `<button onclick="togglePalabra('${palabra}')" class="${clasesBase}">${palabra}</button>`;
      });

      // pintar las vidas (bolitas)
      const divVidas = document.getElementById("vidas-container");
      divVidas.innerHTML = "";
      for (let i = 0; i < 4; i++) {
        if (i < vidas) {
          divVidas.innerHTML += `<div class="w-3 h-3 rounded-full bg-primary transition-all"></div>`;
        } else {
          divVidas.innerHTML += `<div class="w-3 h-3 rounded-full bg-slate-300 transition-all"></div>`;
        }
      }
    }

    // interactividad
    function togglePalabra(palabra) {
      if (palabrasSeleccionadas.includes(palabra)) {
        // si ya estaba seleccionada, la quitamos
        palabrasSeleccionadas = palabrasSeleccionadas.filter(p => p !== palabra);
      } else {
        // si no estaba, y tenemos menos de 4, la añadimos
        if (palabrasSeleccionadas.length < 4) {
          palabrasSeleccionadas.push(palabra);
        }
      }

      // despues de cambiar el estado, repintamos la cuadricula
      dibujarJuego();
    }

    function deselectAll() {
      palabrasSeleccionadas = [];
      dibujarJuego();
    }

    function mezclarPalabras() {
      palabrasActivas.sort(() => Math.random() - 0.5);
      dibujarJuego();
    }

    function comprobarJugada() {
      if (palabrasSeleccionadas.length !== 4) return; // tiene que haber 4 marcadas

      // buscamos si la seleccion coincide exactamente con alguna solucion
      const categoriaEncontrada = soluciones.find(solucion => {
        return solucion.palabras.every(p => palabrasSeleccionadas.includes(p));
      });

      if (categoriaEncontrada) {
        categoriasAcertadas.push(categoriaEncontrada); // la pasamos arriba
        palabrasActivas = palabrasActivas.filter(p => !palabrasSeleccionadas.includes(p)); // la borramos de abajo
        palabrasSeleccionadas = []; // vaciamos la seleccion

        // comprobar si hemos ganado
        if (categoriasAcertadas.length == 4) {
          setTimeout(() => alert("CONGRATULATIONS! You won."), 300);
        }
      } else {
        vidas--;
        if (vidas <= 0) {
          setTimeout(() => alert("GAME OVER! You've run out of lives."), 300);
        }
      }

      dibujarJuego();
    }

    dibujarJuego();
  </script>
</body>
</html>
